[package]
name = "kyvora-desktop"
version = "0.1.0"
description = "Kyvora Studio Desktop Video Editor"
authors = ["Kyvora Team"]
edition = "2021"

[lib]
name = "kyvora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-opener = "2.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
